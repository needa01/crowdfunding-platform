<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Campaigns</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #f5f7fb;
      }

      .campaign-card {
        border: none;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        transition: 0.3s;
      }

      .campaign-card:hover {
        transform: translateY(-3px);
      }

      .campaign-img {
        height: 220px;
        object-fit: cover;
        width: 100%;
      }

      .badge-status {
        font-size: 13px;
      }

      .progress {
        height: 10px;
      }

      .remarks {
        font-size: 14px;
        color: #666;
      }

      .empty-box {
        text-align: center;
        padding: 80px;
      }

      .loading {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container py-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>My Campaigns</h2>

        <button class="btn btn-primary" onclick="loadMyCampaigns()">
          Refresh
        </button>
      </div>

      <div id="loading" class="loading text-center">
        <div class="spinner-border"></div>

        <p class="mt-2">Loading campaigns...</p>
      </div>

      <div class="row" id="campaignContainer"></div>
    </div>

    <script>
      const API_URL = "http://127.0.0.1:8000/api/campaigns/my-campaigns";

      const token = sessionStorage.getItem("access_token");

      async function loadMyCampaigns() {
        document.getElementById("loading").style.display = "block";

        const container = document.getElementById("campaignContainer");
        container.innerHTML = "";

        try {
          const response = await fetch(API_URL, {
            headers: {
              Authorization: "Bearer " + token,
            },
          });

          const data = await response.json();

          document.getElementById("loading").style.display = "none";

          let campaigns = [];

          if (Array.isArray(data)) campaigns = data;
          else if (data.results) campaigns = data.results;
          else if (data.data) campaigns = data.data;

          if (campaigns.length === 0) {
            container.innerHTML = `
            <div class="empty-box">

                <h4>No Campaigns Found</h4>

                <p>You haven't created any campaigns yet.</p>

            </div>
            `;

            return;
          }

          campaigns.forEach((c) => {
            let percentage = 0;

            if (parseFloat(c.goal_amount) > 0) {
              percentage =
                (parseFloat(c.raised_amount) / parseFloat(c.goal_amount)) * 100;

              if (percentage > 100) {
                percentage = 100;
              }
            }

            // Campaign Status Badge
            let statusColor = "secondary";

            switch (c.campaign_status) {
              case "Draft":
                statusColor = "dark";
                break;
              case "Pending":
                statusColor = "warning";
                break;
              case "Active":
                statusColor = "success";
                break;
              case "Paused":
                statusColor = "info";
                break;
              case "Completed":
                statusColor = "primary";
                break;
              case "Rejected":
                statusColor = "danger";
                break;
              case "Closed":
                statusColor = "secondary";
                break;
            }

            // Verification Status Badge
            let verifyColor = "secondary";

            switch (c.verification_status) {
              case "Pending":
                verifyColor = "warning";
                break;
              case "Approved":
                verifyColor = "success";
                break;
              case "Rejected":
                verifyColor = "danger";
                break;
            }

            // Action Button
            let actionButton = "";

            if (c.campaign_status === "Draft") {
              actionButton = `
                    <a href="my-campaign/edit?slug=${c.campaign_slug}"
                    class="btn btn-warning w-100">
                        ✏️ Edit Campaign
                    </a>
                `;
            } else {
              actionButton = `
                    <a href="my-campaign?slug=${c.campaign_slug}"
                    class="btn btn-primary w-100">
                        👁 View Campaign
                    </a>
                `;
            }

            container.innerHTML += `

                    <div class="col-md-6 mb-4">

                        <div class="card campaign-card h-100">

                            <img src="${c.cover_photo}"
                                class="campaign-img"
                                onerror="this.src='https://placehold.co/600x300?text=No+Image';">

                            <div class="card-body d-flex flex-column">

                                <h5 class="fw-bold">${c.campaign_name}</h5>

                                <p class="text-muted small">
                                    ${c.campaign_desc}
                                </p>

                                <div class="mb-2">
                                    <strong>Cause:</strong> ${c.cause}
                                </div>

                                <div class="mb-3">
                                    <strong>Beneficiary:</strong> ${c.beneficiary_name}
                                </div>

                                <div class="d-flex justify-content-between">

                                    <div>
                                        <small class="text-muted">Goal</small>
                                        <div class="fw-bold">
                                            ₹${Number(c.goal_amount).toLocaleString()}
                                        </div>
                                    </div>

                                    <div class="text-end">
                                        <small class="text-muted">Raised</small>
                                        <div class="fw-bold text-success">
                                            ₹${Number(c.raised_amount).toLocaleString()}
                                        </div>
                                    </div>

                                </div>

                                <div class="progress mt-3">

                                    <div class="progress-bar bg-success"
                                        style="width:${percentage}%">
                                    </div>

                                </div>

                                <small class="text-end mt-1">
                                    ${percentage.toFixed(1)}%
                                </small>

                                <hr>

                                <div class="d-flex justify-content-between">

                                    <div>

                                        <small class="text-muted">
                                            Campaign
                                        </small>

                                        <br>

                                        <span class="badge bg-${statusColor}">
                                            ${c.campaign_status}
                                        </span>

                                    </div>

                                    <div class="text-end">

                                        <small class="text-muted">
                                            Verification
                                        </small>

                                        <br>

                                        <span class="badge bg-${verifyColor}">
                                            ${c.verification_status ?? "-"}
                                        </span>

                                    </div>

                                </div>

                                ${
                                  c.verification_remarks
                                    ? `
                                    <div class="alert alert-light border mt-3 mb-0">
                                        <strong>Remarks</strong><br>
                                        ${c.verification_remarks}
                                    </div>
                                    `
                                    : ""
                                }

                                <hr>

                                <div class="row text-center">

                                    <div class="col">
                                        <small class="text-muted">
                                            Start
                                        </small>

                                        <div>
                                            ${c.start_date}
                                        </div>
                                    </div>

                                    <div class="col">
                                        <small class="text-muted">
                                            End
                                        </small>

                                        <div>
                                            ${c.end_date}
                                        </div>
                                    </div>

                                </div>

                                <div class="mt-3">

                                    <small class="text-muted">
                                        Created:
                                        ${new Date(c.created_at).toLocaleString()}
                                    </small>

                                </div>

                                <div class="mt-auto pt-3">

                                    ${actionButton}

                                </div>

                            </div>

                        </div>

                    </div>

                    `;
          });
        } catch (err) {
          console.log(err);

          document.getElementById("loading").style.display = "none";

          container.innerHTML = `

        <div class="alert alert-danger">

            Failed to load campaigns.

        </div>

        `;
        }
      }

      loadMyCampaigns();
    </script>
  </body>
</html>
