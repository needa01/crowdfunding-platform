<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change Password</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f6f9;
      }

      .container {
        width: 400px;
        margin: 80px auto;
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }

      h2 {
        text-align: center;
        margin-bottom: 25px;
      }

      input {
        width: 100%;
        padding: 12px;
        margin-top: 12px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 5px;
      }

      button {
        width: 100%;
        padding: 12px;
        margin-top: 20px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
      }

      button:hover {
        background: #0056b3;
      }

      button:disabled {
        background: #999;
        cursor: not-allowed;
      }

      .success {
        color: green;
        text-align: center;
        margin-top: 15px;
      }

      .error {
        color: red;
        text-align: center;
        margin-top: 15px;
      }

      .back {
        text-align: center;
        margin-top: 20px;
      }

      .back a {
        color: #007bff;
        text-decoration: none;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>Change Password</h2>

      <form id="changePasswordForm">
        <input
          type="password"
          id="old_password"
          placeholder="Current Password"
          required
        />

        <input
          type="password"
          id="new_password"
          placeholder="New Password"
          required
        />

        <input
          type="password"
          id="confirm_password"
          placeholder="Confirm New Password"
          required
        />

        <button type="submit" id="changePasswordBtn">Change Password</button>
      </form>

      <div id="message"></div>

      <div class="back">
        <a href="/frontend/campaigns">← Back</a>
      </div>
    </div>

    <script>
      const form = document.getElementById("changePasswordForm");
      const messageDiv = document.getElementById("message");
      const button = document.getElementById("changePasswordBtn");
      const accessToken = sessionStorage.getItem("access_token");

      // CHECK ACCESS TOKEN WHEN PAGE LOADS
      document.addEventListener("DOMContentLoaded", function () {
        if (!accessToken) {
          window.location.href =
            "/frontend/login?next=" +
            encodeURIComponent(window.location.pathname);
          return;
        }
      });
      form.addEventListener("submit", async function (event) {
        event.preventDefault();

        messageDiv.innerHTML = "";
        messageDiv.className = "";

        const oldPassword = document.getElementById("old_password").value;

        const newPassword = document.getElementById("new_password").value;

        const confirmPassword =
          document.getElementById("confirm_password").value;

        // Check password match
        if (newPassword !== confirmPassword) {
          messageDiv.className = "error";
          messageDiv.innerHTML =
            "New password and confirm password do not match.";
          return;
        }

        // Optional: prevent same password
        if (oldPassword === newPassword) {
          messageDiv.className = "error";
          messageDiv.innerHTML =
            "New password must be different from your current password.";
          return;
        }

        button.disabled = true;
        button.innerHTML = "Changing Password...";

        try {
          const response = await fetch("/api/accounts/change-password", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: "Bearer " + accessToken,
            },
            body: JSON.stringify({
              old_password: oldPassword,
              new_password: newPassword,
              confirm_password: confirmPassword,
            }),
          });

          const data = await response.json();

          if (response.ok && data.success) {
            messageDiv.className = "success";
            messageDiv.innerHTML =
              data.message || "Password changed successfully.";

            form.reset();

            /*
             * If your backend invalidates the old access token
             * after password change, remove the tokens here.
             *
             * sessionStorage.removeItem("access_token");
             * sessionStorage.removeItem("refresh_token");
             */

            setTimeout(() => {
              window.location.href = "/frontend/campaigns";
            }, 1500);
          } else {
            messageDiv.className = "error";

            if (data.error) {
              messageDiv.innerHTML = data.error;
            } else if (data.message) {
              messageDiv.innerHTML = data.message;
            } else {
              let errors = [];

              for (const key in data) {
                if (Array.isArray(data[key])) {
                  errors.push(data[key][0]);
                } else if (typeof data[key] === "string") {
                  errors.push(data[key]);
                }
              }

              messageDiv.innerHTML =
                errors.join("<br>") || "Unable to change password.";
            }
          }
        } catch (error) {
          console.error(error);

          messageDiv.className = "error";
          messageDiv.innerHTML = "Something went wrong. Please try again.";
        }

        button.disabled = false;
        button.innerHTML = "Change Password";
      });
    </script>
  </body>
</html>
