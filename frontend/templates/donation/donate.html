<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Donate</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        margin: 0;
        padding: 40px;
      }

      .container {
        max-width: 600px;
        margin: auto;
        background: #fff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
      }

      h2 {
        margin-top: 0;
      }

      label {
        display: block;
        margin-top: 20px;
        font-weight: bold;
      }

      input,
      textarea {
        width: 100%;
        padding: 12px;
        margin-top: 8px;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-sizing: border-box;
      }

      textarea {
        resize: vertical;
        height: 90px;
      }

      button {
        margin-top: 25px;
        padding: 12px 25px;
        border: none;
        background: #0d6efd;
        color: white;
        border-radius: 6px;
        cursor: pointer;
      }

      button:hover {
        background: #0b5ed7;
      }

      .hidden {
        display: none;
      }

      .payment-box {
        margin-top: 30px;
        border: 1px solid #ddd;
        padding: 20px;
        border-radius: 8px;
        background: #fafafa;
      }

      .success {
        color: green;
        font-weight: bold;
        margin-top: 20px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>Donate to Campaign</h2>

      <label>Donation Amount (₹)</label>
      <input type="number" id="amount" placeholder="100" />

      <label>Message</label>
      <textarea id="message"></textarea>

      <label>
        <input type="checkbox" id="anonymous" />
        Donate anonymously
      </label>

      <button type="button" onclick="createDonation()">Donate Now</button>

      <div class="payment-box hidden" id="paymentSection">
        <h3>Demo Payment</h3>

        <p><b>Bank :</b> HDFC Bank</p>

        <p><b>Account :</b> 123456789012</p>

        <p><b>IFSC :</b> HDFC0000123</p>

        <hr />

        <label>Reference Number / UTR</label>

        <input
          type="text"
          id="reference_number"
          placeholder="Enter UTR Number"
        />

        <button type="button" onclick="verifyPayment()">Verify Payment</button>
      </div>

      <div id="result" class="success"></div>
    </div>

    <script>
      let transactionUUID = null;
      const campaignSlug = "{{ campaign_slug }}";

      const token = sessionStorage.getItem("access_token");

      async function createDonation() {
        const response = await fetch("/api/donations/create-donation", {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + token,
          },

          body: JSON.stringify({
            campaign_slug: campaignSlug,
            amount: document.getElementById("amount").value,

            message: document.getElementById("message").value,

            is_anonymous: document.getElementById("anonymous").checked,
          }),
        });

        const data = await response.json();

        if (!data.success) {
          alert(data.message);

          return;
        }

        transactionUUID = data.data.transaction_uuid;

        document.getElementById("paymentSection").classList.remove("hidden");

        alert("Donation created. Complete demo payment.");
      }

      async function verifyPayment() {
        const response = await fetch("/api/payments/verify", {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + token,
          },

          body: JSON.stringify({
            transaction_uuid: transactionUUID,

            reference_number: document.getElementById("reference_number").value,
          }),
        });

        const data = await response.json();

        if (!data.success) {
          alert(data.message);

          return;
        }

        document.getElementById("result").innerHTML =
          "🎉 Donation Successful.<br><br>" +
          "Donation No : " +
          data.data.donation_number +
          "<br>Receipt No : " +
          data.data.receipt_number;
      }
    </script>
  </body>
</html>
