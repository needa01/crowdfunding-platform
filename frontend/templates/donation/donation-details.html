<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Donation Details</title>

    <link rel="stylesheet" href="/static/css/style.css" />

    <style>
      body {
        background: #f5f6fa;
        font-family: Arial, sans-serif;
      }

      .container {
        width: 900px;
        margin: 40px auto;
      }

      .card {
        background: white;
        border-radius: 10px;
        padding: 25px;
        margin-bottom: 20px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }

      h2 {
        margin-top: 0;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      td {
        padding: 12px 8px;
        border-bottom: 1px solid #eee;
      }

      td:first-child {
        width: 220px;
        color: #666;
        font-weight: bold;
      }

      .success {
        color: green;
        font-weight: bold;
      }

      .failed {
        color: red;
        font-weight: bold;
      }

      .pending {
        color: orange;
        font-weight: bold;
      }

      .btn {
        padding: 12px 18px;
        background: #1c7ed6;
        color: white;
        text-decoration: none;
        border-radius: 6px;
        display: inline-block;
        margin-top: 15px;
      }

      .campaign-title {
        font-size: 22px;
        font-weight: bold;
      }
      .back-btn {
        display: inline-block;
        margin-bottom: 15px;
        padding: 10px 16px;
        background: #ffffff;
        color: #333;
        text-decoration: none;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
      }

      .back-btn:hover {
        background: #f0f0f0;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <a href="javascript:history.back()" class="back-btn"> ← Back </a>
      <div class="card">
        <h2>Donation Details</h2>

        <table>
          <tr>
            <td>Donation Number</td>
            <td id="donation-number"></td>
          </tr>

          <tr>
            <td>Status</td>
            <td id="status"></td>
          </tr>

          <tr>
            <td>Amount</td>
            <td id="amount"></td>
          </tr>

          <tr>
            <td>Currency</td>
            <td id="currency"></td>
          </tr>

          <tr>
            <td>Donated On</td>
            <td id="donated-at"></td>
          </tr>

          <tr>
            <td>Anonymous</td>
            <td id="anonymous"></td>
          </tr>

          <tr>
            <td>Your Message</td>
            <td id="message"></td>
          </tr>
        </table>
      </div>

      <div class="card" id="donation-context-card">
        <h2 id="context-title"></h2>

        <img
          id="context-cover-photo"
          src=""
          alt=""
          style="
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 8px;
            display: none;
            margin-bottom: 15px;
          "
        />

        <div class="campaign-title" id="context-name"></div>

        <a id="campaign-link" class="btn" style="display: none">
          View Campaign
        </a>
      </div>

      <div class="card">
        <h2>Receipt</h2>

        <table>
          <tr>
            <td>Receipt Number</td>
            <td id="receipt-number"></td>
          </tr>
        </table>

        <button id="receipt-action" class="btn" style="display: none"></button>
      </div>

      <div class="card">
        <h2>Payment Information</h2>

        <table>
          <tr>
            <td>Gateway</td>
            <td id="gateway"></td>
          </tr>

          <tr>
            <td>Payment Method</td>
            <td id="payment-method"></td>
          </tr>

          <tr>
            <td>Transaction Status</td>
            <td id="payment-status"></td>
          </tr>

          <tr>
            <td>Gateway Payment ID</td>
            <td id="payment-id"></td>
          </tr>
        </table>
      </div>
    </div>

    <script>
      const donationUUID = window.location.pathname
        .split("/")
        .filter(Boolean)
        .pop();

      const token = sessionStorage.getItem("access_token");

      async function loadDonation() {
        const response = await fetch(`/api/donations/${donationUUID}`, {
          headers: {
            Authorization: `Bearer ${token}`,
          },
        });

        const result = await response.json();

        if (!result.success) {
          alert(result.message);
          return;
        }

        const d = result.data;

        document.getElementById("donation-number").innerText =
          d.donation_number;

        document.getElementById("amount").innerText = "₹" + d.amount;

        document.getElementById("currency").innerText = d.currency;

        document.getElementById("anonymous").innerText = d.is_anonymous
          ? "Yes"
          : "No";

        document.getElementById("message").innerText = d.message || "-";

        // ==========================================================
        // CAMPAIGN / PLATFORM
        // ==========================================================

        const contextTitle = document.getElementById("context-title");
        const contextName = document.getElementById("context-name");
        const contextCoverPhoto = document.getElementById(
          "context-cover-photo",
        );
        const campaignLink = document.getElementById("campaign-link");

        if (d.campaign) {
          // ------------------------------------------
          // Campaign Donation
          // ------------------------------------------

          contextTitle.innerText = "Campaign";

          contextName.innerText = d.campaign.campaign_name;

          if (d.campaign.cover_photo) {
            contextCoverPhoto.src = d.campaign.cover_photo;
            contextCoverPhoto.style.display = "block";
          }

          campaignLink.href = `/frontend/campaign/${d.campaign.campaign_slug}`;

          campaignLink.style.display = "inline-block";
        } else if (d.platform) {
          // ------------------------------------------
          // Platform Donation
          // ------------------------------------------

          contextTitle.innerText = "Platform Donation";

          contextName.innerText = d.platform.name || "Our Platform";

          if (d.platform.cover_photo) {
            contextCoverPhoto.src = d.platform.cover_photo;
            contextCoverPhoto.style.display = "block";
          }

          // No campaign link for platform donation
          campaignLink.style.display = "none";
        }

        document.getElementById("donated-at").innerText = d.donated_at || "-";

        let statusHTML = "";

        if (d.status === "Success") {
          statusHTML = `<span class="success">${d.status}</span>`;
        } else if (d.status === "Pending") {
          statusHTML = `<span class="pending">${d.status}</span>`;
        } else {
          statusHTML = `<span class="failed">${d.status}</span>`;
        }

        document.getElementById("status").innerHTML = statusHTML;

        document.getElementById("gateway").innerText = d.payment.gateway || "-";

        document.getElementById("payment-method").innerText =
          d.payment.payment_method || "-";

        document.getElementById("payment-status").innerText =
          d.payment.transaction_status || "-";

        document.getElementById("payment-id").innerText =
          d.payment.gateway_payment_id || "-";

        // Receipt
        setupReceipt(d.receipt);
      }
      function setupReceipt(receipt) {
        const receiptNumber = document.getElementById("receipt-number");
        const receiptAction = document.getElementById("receipt-action");

        // =========================================================
        // NO RECEIPT RECORD YET
        // =========================================================

        if (!receipt.available) {
          receiptNumber.innerText = "Not Generated";

          receiptAction.style.display = "inline-block";
          receiptAction.innerText = "Generate Receipt";
          receiptAction.disabled = false;
          receiptAction.onclick = generateReceipt;

          return;
        }

        // =========================================================
        // RECEIPT RECORD EXISTS
        // =========================================================

        receiptNumber.innerText = receipt.receipt_number || "Not Generated";

        receiptAction.style.display = "inline-block";
        receiptAction.disabled = false;

        // =========================================================
        // RECEIPT PDF DOES NOT EXIST
        // =========================================================

        if (!receipt.has_receipt_file) {
          receiptAction.innerText = "Generate Receipt";
          receiptAction.onclick = generateReceipt;
        }

        // =========================================================
        // RECEIPT PDF EXISTS
        // =========================================================
        else {
          receiptAction.innerText = "Download Receipt";
          receiptAction.onclick = downloadReceipt;
        }
      }

      async function generateReceipt() {
        const button = document.getElementById("receipt-action");
        const receiptNumber = document.getElementById("receipt-number");

        button.disabled = true;
        button.innerText = "Generating...";

        try {
          const response = await fetch(
            `/api/donations/${donationUUID}/generate-receipt/`,
            {
              method: "POST",
              headers: {
                Authorization: `Bearer ${token}`,
              },
            },
          );

          const result = await response.json();

          if (!response.ok || !result.success) {
            alert(result.message || "Unable to generate receipt.");

            button.disabled = false;
            button.innerText = "Generate Receipt";

            return;
          }

          // =======================================================
          // GET NEWLY GENERATED RECEIPT DATA
          // =======================================================

          const receipt = result.data;

          // Display newly generated receipt number
          receiptNumber.innerText = receipt.receipt_number;

          // =======================================================
          // PDF HAS BEEN GENERATED
          // =======================================================

          button.disabled = false;
          button.innerText = "Download Receipt";
          button.onclick = downloadReceipt;
        } catch (error) {
          console.error("Receipt generation error:", error);

          alert("Unable to generate receipt.");

          button.disabled = false;
          button.innerText = "Generate Receipt";
        }
      }

      async function downloadReceipt() {
        const button = document.getElementById("receipt-action");

        button.disabled = true;
        button.innerText = "Downloading...";

        try {
          const response = await fetch(
            `/api/donations/${donationUUID}/download-receipt/`,
            {
              method: "GET",

              headers: {
                Authorization: `Bearer ${token}`,
              },
            },
          );

          if (!response.ok) {
            const result = await response.json();

            alert(result.message || "Unable to download receipt.");

            button.disabled = false;
            button.innerText = "Download Receipt";

            return;
          }

          const blob = await response.blob();

          const url = window.URL.createObjectURL(blob);

          const a = document.createElement("a");

          a.href = url;

          a.download = `${document.getElementById("receipt-number").innerText}.pdf`;

          document.body.appendChild(a);

          a.click();

          a.remove();

          window.URL.revokeObjectURL(url);

          button.disabled = false;
          button.innerText = "Download Receipt";
        } catch (error) {
          console.error(error);

          alert("Unable to download receipt.");

          button.disabled = false;
          button.innerText = "Download Receipt";
        }
      }

      loadDonation();
    </script>
  </body>
</html>
