<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <title>My Donations</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#f4f6f9;
        }

        .container{
            width:1200px;
            margin:40px auto;
        }

        h1{
            margin-bottom:30px;
        }

        .donation-card{

            background:white;
            border-radius:10px;
            padding:20px;
            margin-bottom:20px;

            display:flex;
            justify-content:space-between;
            align-items:center;

            box-shadow:0 2px 8px rgba(0,0,0,.08);

        }

        .campaign{
            display:flex;
            gap:20px;
            align-items:center;
        }

        .campaign img{

            width:120px;
            height:80px;
            object-fit:cover;
            border-radius:8px;

        }

        .campaign h3{
            margin-bottom:8px;
        }

        .campaign p{

            color:#777;
            margin-bottom:5px;

        }

        .amount{

            font-size:22px;
            font-weight:bold;
            color:#0a8f3d;

        }

        .status{

            display:inline-block;

            padding:5px 10px;

            border-radius:20px;

            color:white;

            margin-top:8px;

            font-size:13px;

        }

        .Success{
            background:#16a34a;
        }

        .Pending{
            background:#f59e0b;
        }

        .Failed{
            background:#dc2626;
        }

        .actions{

            text-align:right;

        }

        .btn{

            display:inline-block;

            margin-top:10px;

            text-decoration:none;

            color:white;

            background:#2563eb;

            padding:10px 18px;

            border-radius:6px;

        }

        .empty{

            background:white;

            text-align:center;

            padding:80px;

            border-radius:10px;

        }

    </style>

</head>

<body>

<div class="container">

    <h1>My Donations</h1>

    <div id="donations-container">

    </div>

</div>


<script>

const token = sessionStorage.getItem("access_token");

loadDonations();

async function loadDonations(){

    const response = await fetch(
        "/api/donations/my-donations",
        {
            headers:{
                Authorization:`Bearer ${token}`
            }
        }
    );

    const result = await response.json();

    const container =
        document.getElementById("donations-container");

    container.innerHTML="";

    if(result.count===0){

        container.innerHTML=`

            <div class="empty">

                <h2>No Donations Yet</h2>

                <br>

                <p>
                    You haven't donated to any campaign.
                </p>

            </div>

        `;

        return;

    }

    result.data.forEach(d=>{

        container.innerHTML += `

        <div class="donation-card">

            <div class="campaign">

                <img
                    src="${d.campaign.cover_photo || '/static/images/no-image.png'}"
                >

                <div>

                    <h3>${d.campaign.campaign_name}</h3>

                    <p>

                        Donation No :
                        ${d.donation_number}

                    </p>

                    <p>

                        ${new Date(
                            d.created_at
                        ).toLocaleDateString()}

                    </p>

                    <span
                        class="status ${d.status}"
                    >
                        ${d.status}
                    </span>

                </div>

            </div>

            <div class="actions">

                <div class="amount">

                    ₹${d.amount}

                </div>

                <a
                    class="btn"
                    href="/frontend/donations/${d.uuid}"
                >

                    View Details

                </a>

            </div>

        </div>

        `;

    });

}

</script>

</body>

</html>
