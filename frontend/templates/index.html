<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crowdfunding Platform</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            width: 400px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0,0,0,.1);
        }

        h1 {
            margin-bottom: 30px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        .btn:hover {
            background: #0056b3;
        }

        .login-btn {
            background: green;
        }

        .login-btn:hover {
            background: darkgreen;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>Crowdfunding Platform</h1>

    <a href="{% url 'donor_signup' %}" class="btn">
        Sign Up as Donor
    </a>

    <a href="{% url 'fundraiser_signup' %}" class="btn">
        Sign Up as Individual Fundraiser
    </a>

    <a href="{% url 'ngo_signup' %}" class="btn">
        Sign Up as NGO
    </a>

    <a href="{% url 'csr_signup' %}" class="btn">
        Sign Up as CSR Company
    </a>

    <hr>

    <a href="{% url 'login' %}" class="btn login-btn">
        Login
    </a>

</div>

</body>
</html>
