<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f6f9;
      }

      .container {
        width: 400px;
        margin: 80px auto;
        background: white;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }

      h2 {
        text-align: center;
      }

      input,
      button {
        width: 100%;
        padding: 12px;
        margin-top: 12px;
        box-sizing: border-box;
      }

      button {
        background: #007bff;
        color: white;
        border: none;
        cursor: pointer;
      }

      button:hover {
        background: #0056b3;
      }

      .success {
        color: green;
      }

      .error {
        color: red;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Login</h2>

      <form id="loginForm">
        <div style="text-align: center; margin-bottom: 20px">
          <span>Don't have an account?</span>
          <a
            href="/frontend/signup/donor"
            id="signupLink"
            style="
              color: #007bff;
              text-decoration: none;
              font-weight: bold;
              margin-left: 5px;
            "
          >
            Sign Up
          </a>
        </div>
        <input type="email" id="email" placeholder="Email" required />

        <input type="password" id="password" placeholder="Password" required />
        
        <button type="submit">Login</button>
      </form>

      <br />

      <div id="message"></div>
    </div>

    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", async function (event) {
          event.preventDefault();

          const payload = {
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
          };

          const urlParams = new URLSearchParams(window.location.search);
          const nextUrl = urlParams.get("next");
          if (nextUrl) {
            document.getElementById("signupLink").href =
              "/frontend/signup/donor?next=" + encodeURIComponent(nextUrl);
          }
          try {
            const response = await fetch("/api/accounts/login", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify(payload),
            });

            const data = await response.json();

            if (data.success) {
              sessionStorage.setItem("access_token", data.access_token);

              sessionStorage.setItem("refresh_token", data.refresh_token);

              document.getElementById("message").innerHTML =
                `<p class="success">${data.message}</p>`;

              const userResponse = await fetch("/api/accounts/get-user-info", {
                method: "GET",
                headers: {
                  Authorization: "Bearer " + data.access_token,
                },
              });

              const userData = await userResponse.json();

              const userType = userData.user_type;
              const profileStatus = userData.profile_status;

              setTimeout(() => {
                if (
                  userType === "INDIVIDUAL_FUNDRAISER" &&
                  profileStatus === "BASIC_INFO"
                ) {
                  window.location.href = "/frontend/register/fundraiser";
                } else if (
                  userType === "NGO" &&
                  profileStatus === "BASIC_INFO"
                ) {
                  window.location.href = "/frontend/register/ngo";
                } else if (
                  userType === "CSR" &&
                  profileStatus === "BASIC_INFO"
                ) {
                  window.location.href = "/frontend/register/csr";
                } else {
                  if (nextUrl) {
                    window.location.href = nextUrl;
                  } else {
                    window.location.href = "/campaigns";
                  }
                }
              }, 1000);
            } else {
              document.getElementById("message").innerHTML =
                `<p class="error">${data.error}</p>`;
            }
          } catch (error) {
            document.getElementById("message").innerHTML =
              `<p class="error">Something went wrong</p>`;
          }
        });
    </script>
  </body>
</html>
