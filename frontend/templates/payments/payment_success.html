<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Promotion Payment Successful</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
      }

      .container {
        width: 90%;
        max-width: 550px;
        background: #fff;
        padding: 45px 40px;
        border-radius: 14px;
        text-align: center;
        box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
      }

      .success-icon {
        width: 85px;
        height: 85px;
        margin: 0 auto 22px;
        border-radius: 50%;
        background: #e8f7ee;
        color: #198754;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 48px;
        font-weight: bold;
      }

      h1 {
        margin: 0 0 12px;
        color: #198754;
        font-size: 30px;
      }

      .message {
        margin: 0 auto 25px;
        color: #555;
        line-height: 1.6;
        font-size: 16px;
      }

      .info-box {
        background: #f8f9fa;
        border: 1px solid #e1e1e1;
        border-radius: 8px;
        padding: 18px;
        margin-bottom: 25px;
        color: #555;
        line-height: 1.6;
      }

      .info-box strong {
        color: #222;
      }

      .button {
        display: inline-block;
        padding: 12px 25px;
        background: #0d6efd;
        color: white;
        text-decoration: none;
        border-radius: 6px;
        font-size: 15px;
      }

      .button:hover {
        background: #0b5ed7;
      }
    </style>
  </head>

  <body>

    <div class="container">

      <div class="success-icon">
        ✓
      </div>

      <h1>Payment Successful!</h1>

      <p class="message">
        Your campaign promotion payment has been successfully processed.
      </p>

      <div class="info-box">
        <strong>Your promotion is now active.</strong>
        <br />
        The selected promotion services for your campaign will now be
        processed according to their respective schedules.
      </div>

      <a href="/frontend/profile/my-campaigns" class="button">
        Back to Campaigns
      </a>

    </div>

  </body>
</html>
