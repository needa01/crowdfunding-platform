<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Donor Management</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #f8f9fa;
      }

      .page-header {
        margin-bottom: 30px;
      }

      .filter-btn {
        border-radius: 50px;
        padding: 10px 24px;
        font-weight: 600;
        transition: 0.3s;
      }

      .filter-btn.active {
        background: #0d6efd;
        color: #fff;
      }

      .table-card {
        border: none;
        border-radius: 14px;
        box-shadow: 0 5px 18px rgba(0, 0, 0, 0.06);
      }

      .table thead {
        background: #f1f3f5;
      }

      .badge-status {
        font-size: 0.85rem;
      }
    </style>
  </head>

  <body>
    <div class="container py-5">
      <div class="page-header mb-4">
        <div class="mb-3">
          <a
            href="/frontend/admin/dashboard"
            class="btn btn-sm btn-outline-secondary"
          >
            ← Back
          </a>
        </div>

        <h2 class="fw-bold mb-1">Donor Management</h2>

        <p class="text-muted mb-0">
          Review and manage donor verification requests.
        </p>
      </div>

      <!-- FILTERS -->

      <div class="mb-4">
        <div class="btn-group">
          <button
            class="btn btn-outline-primary filter-btn"
            data-status="pending"
          >
            Pending
          </button>

          <button
            class="btn btn-outline-success filter-btn"
            data-status="approved"
          >
            Approved
          </button>

          <button
            class="btn btn-outline-danger filter-btn"
            data-status="rejected"
          >
            Rejected
          </button>
        </div>
      </div>

      <!-- TABLE -->

      <div class="card table-card">
        <div class="card-body p-0">
          <table class="table table-hover align-middle mb-0">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Mobile</th>
                <th>Joined</th>
                <th>Status</th>
                <th width="150">Action</th>
              </tr>
            </thead>

            <tbody id="donorTable"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      function admin_logout() {
        sessionStorage.removeItem("access_token");
        sessionStorage.removeItem("refresh_token");

        window.location.href = "/frontend/admin/login";
      }

      const BASE_URL = "http://127.0.0.1:8000"; // Change to your backend URL

      const params = new URLSearchParams(window.location.search);

      const role = "donor";
      const status = params.get("status") || "pending";

      // Set default URL if params are missing
      if (!params.has("role") || !params.has("status")) {
        const url = new URL(window.location);

        url.searchParams.set("status", status);

        window.history.replaceState({}, "", url);
      }

      // Highlight selected filter
      document.querySelectorAll(".filter-btn").forEach((btn) => {
        if (btn.dataset.status === status) {
          btn.classList.remove(
            "btn-outline-primary",
            "btn-outline-success",
            "btn-outline-danger",
          );
          btn.classList.add("active");
        }
      });

      // ----------------------------
      // API CALL
      // ----------------------------

      async function loadDonors(role, status) {
        const token = sessionStorage.getItem("access_token");

        if (!token) {
          admin_logout();
          return;
        }
        try {
          const response = await fetch(
            `${BASE_URL}/api/admin/get-users?role=${role}&status=${status}`,
            {
              headers: {
                Authorization: "Bearer " + token,
              },
            },
          );
          if (response.status === 401 || response.status === 403) {
            admin_logout();
            return;
          }
          const data = await response.json();

          console.log(data.results);

          populateTable(data.results, data.status); // Change according to your API response
        } catch (error) {
          console.error(error);
        }
      }

      // ----------------------------
      // TABLE
      // ----------------------------

      function populateTable(users, verificationStatus) {
        const tbody = document.getElementById("donorTable");
        tbody.innerHTML = "";

        if (!users || users.length === 0) {
          tbody.innerHTML = `
                <tr>
                    <td colspan="7" class="text-center py-4">
                        No donors found.
                    </td>
                </tr>
            `;

          return;
        }

        users.forEach((user, index) => {
          const submittedDate = new Date(
            user.verification_submitted_at,
          ).toLocaleDateString();
          
          let badgeClass = "bg-warning text-dark";


          if (verificationStatus.toLowerCase() === "approved") {
            badgeClass = "bg-success";
          } else if (verificationStatus.toLowerCase() === "rejected") {
            badgeClass = "bg-danger";
          }

          tbody.innerHTML += `
                <tr>

                    <td>${index + 1}</td>

                    <td>${user.fullname}</td>

                    <td>${user.email}</td>

                    <td>${user.mobile}</td>

                    <td>${submittedDate}</td>

                    <td>
                        <span class="badge ${badgeClass}">
                            ${verificationStatus}
                        </span>
                    </td>

                    <td>
                        <button class="btn btn-primary btn-sm" onclick="window.location.href='/frontend/admin/donor-verification/${user.uuid}'"> View </button>
                    </td>

                </tr>
            `;
        });
      }
      // ----------------------------
      // FILTER CLICK
      // ----------------------------

      document.querySelectorAll(".filter-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const selectedStatus = btn.dataset.status;

          // Update URL without page reload
          const url = new URL(window.location);

          url.searchParams.set("status", selectedStatus);

          window.history.pushState({}, "", url);

          // Update active button
          document.querySelectorAll(".filter-btn").forEach((button) => {
            button.classList.remove("active");

            button.classList.add(
              button.dataset.status === "pending"
                ? "btn-outline-primary"
                : button.dataset.status === "approved"
                  ? "btn-outline-success"
                  : "btn-outline-danger",
            );
          });

          btn.classList.remove(
            "btn-outline-primary",
            "btn-outline-success",
            "btn-outline-danger",
          );

          btn.classList.add("active");

          // Call API
          loadDonors(role, selectedStatus);
        });
      });

      // Initial API Call
      loadDonors(role, status);
    </script>
  </body>
</html>
