<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Promotion Services Management</title>

<link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  rel="stylesheet"
/>

<style>
  body {
    background: #f8f9fa;
  }

  .page-header {
    margin-bottom: 30px;
  }

  .filter-btn {
    border-radius: 50px;
    padding: 10px 24px;
    font-weight: 600;
    transition: 0.3s;
  }

  .filter-btn.active {
    color: #fff;
  }

  .filter-btn[data-status="pending"].active {
    background: #ffc107;
    color: #212529;
  }

  .filter-btn[data-status="submitted"].active {
    background: #0d6efd;
  }

  .filter-btn[data-status="active"].active {
    background: #198754;
  }

  .filter-btn[data-status="completed"].active {
    background: #6f42c1;
  }

  .filter-btn[data-status="cancelled"].active {
    background: #dc3545;
  }

  .table-card {
    border: none;
    border-radius: 14px;
    box-shadow: 0 5px 18px rgba(0, 0, 0, 0.06);
    overflow: hidden;
  }

  .table thead {
    background: #f1f3f5;
  }

  .badge-status {
    font-size: 0.85rem;
  }

  .service-badge {
    font-size: 0.85rem;
  }
</style>


  </head>

  <body>
    <div class="container-fluid px-4 py-5">
      <!-- HEADER -->
      <div class="page-header mb-4">
        <div class="mb-3">
          <a
            href="/frontend/admin/dashboard"
            class="btn btn-sm btn-outline-secondary"
          >
            ← Back
          </a>
        </div>


    <h2 class="fw-bold mb-1">Promotion Services Management</h2>

    <p class="text-muted mb-0">
      Review and manage campaign promotion service requests.
    </p>
  </div>

  <!-- FILTERS -->
  <div class="mb-4">
    <div class="btn-group flex-wrap">

      <button
        class="btn btn-outline-warning filter-btn"
        data-status="pending"
      >
        Pending
      </button>

      <button
        class="btn btn-outline-primary filter-btn"
        data-status="submitted"
      >
        Submitted
      </button>

      <button
        class="btn btn-outline-success filter-btn"
        data-status="active"
      >
        Active
      </button>

      <button
        class="btn btn-outline-secondary filter-btn"
        data-status="completed"
      >
        Completed
      </button>

      <button
        class="btn btn-outline-danger filter-btn"
        data-status="cancelled"
      >
        Cancelled
      </button>

    </div>
  </div>

  <!-- TABLE -->
  <div class="card table-card">
    <div class="card-body p-0">
      <div class="table-responsive">

        <table class="table table-hover align-middle mb-0">

          <thead>
            <tr>
              <th>ID</th>
              <th>Campaign</th>
              <th>Service Type</th>
              <th>Amount</th>
              <th>Fee</th>
              <th>Tax</th>
              <th>Total</th>
              <th>Currency</th>
              <th>Status</th>
              <th>Created</th>
              <th width="100">Action</th>
            </tr>
          </thead>

          <tbody id="PromotionServicesTable"></tbody>

        </table>

      </div>
    </div>
  </div>
</div>

<script>
  function admin_logout() {
    sessionStorage.removeItem("access_token");
    sessionStorage.removeItem("refresh_token");

    window.location.href = "/frontend/admin/login";
  }

  const BASE_URL = process.env.API_BASE_URL;

  // =========================================================
  // GET STATUS FROM URL
  // =========================================================

  const params = new URLSearchParams(window.location.search);

  const status = params.get("status") || "pending";

  // Set default status in URL
  if (!params.has("status")) {
    const url = new URL(window.location);

    url.searchParams.set("status", status);

    window.history.replaceState({}, "", url);
  }

  // =========================================================
  // STATUS BUTTON HELPERS
  // =========================================================

  function getStatusClass(status) {
    switch (status.toLowerCase()) {
      case "pending":
        return "btn-outline-warning";

      case "submitted":
        return "btn-outline-primary";

      case "active":
        return "btn-outline-success";

      case "completed":
        return "btn-outline-secondary";

      case "cancelled":
        return "btn-outline-danger";

      default:
        return "btn-outline-secondary";
    }
  }

  // =========================================================
  // SET ACTIVE FILTER
  // =========================================================

  function setActiveFilter(selectedStatus) {
    document.querySelectorAll(".filter-btn").forEach((button) => {
      const buttonStatus = button.dataset.status;

      button.classList.remove(
        "active",
        "btn-outline-warning",
        "btn-outline-primary",
        "btn-outline-success",
        "btn-outline-secondary",
        "btn-outline-danger"
      );

      button.classList.add(getStatusClass(buttonStatus));

      if (buttonStatus === selectedStatus) {
        button.classList.remove(getStatusClass(buttonStatus));

        button.classList.add("active");
      }
    });
  }

  setActiveFilter(status);

  // =========================================================
  // STATUS BADGE
  // =========================================================

  function getStatusBadge(status) {
    const normalizedStatus = String(status).toLowerCase();

    let badgeClass = "bg-secondary";

    switch (normalizedStatus) {
      case "pending":
        badgeClass = "bg-warning text-dark";
        break;

      case "submitted":
        badgeClass = "bg-primary";
        break;

      case "active":
        badgeClass = "bg-success";
        break;

      case "completed":
        badgeClass = "bg-secondary";
        break;

      case "cancelled":
        badgeClass = "bg-danger";
        break;
    }

    return `
      <span class="badge ${badgeClass} badge-status">
        ${status}
      </span>
    `;
  }

  // =========================================================
  // FORMAT MONEY
  // =========================================================

  function formatAmount(amount, currency = "INR") {
    const numericAmount = Number(amount || 0);

    if (currency === "INR") {
      return "₹" + numericAmount.toFixed(2);
    }

    return `${currency} ${numericAmount.toFixed(2)}`;
  }

  // =========================================================
  // FORMAT DATE
  // =========================================================

  function formatDate(dateValue) {
    if (!dateValue) {
      return "-";
    }

    const date = new Date(dateValue);

    if (isNaN(date.getTime())) {
      return "-";
    }

    return date.toLocaleDateString("en-IN");
  }

  // =========================================================
  // GET SERVICE NAME
  // =========================================================

  function getServiceName(serviceType) {
    if (!serviceType) {
      return "-";
    }

    const names = {
      GOOGLE_ADS: "Google Ads",
      SOCIAL_MEDIA_ADS: "Social Media Ads",
      SEO: "SEO"
    };

    return names[serviceType] || serviceType;
  }

  // =========================================================
  // API CALL
  // =========================================================

  async function loadPromotionServices(status) {
    const token = sessionStorage.getItem("access_token");

    if (!token) {
      admin_logout();
      return;
    }

    const tbody = document.getElementById(
      "PromotionServicesTable"
    );

    tbody.innerHTML = `
      <tr>
        <td colspan="11" class="text-center py-4">
          Loading promotion services...
        </td>
      </tr>
    `;

    try {
      const response = await fetch(
        `${BASE_URL}/api/admin/promotion-services/${status}/`,
        {
          method: "GET",

          headers: {
            Authorization: "Bearer " + token,
            "Content-Type": "application/json"
          }
        }
      );

      if (response.status === 401 || response.status === 403) {
        admin_logout();
        return;
      }

      const data = await response.json();

      console.log("Promotion Services Response:", data);

      if (!response.ok) {
        tbody.innerHTML = `
          <tr>
            <td colspan="11" class="text-center py-4 text-danger">
              ${data.message || "Failed to load promotion services."}
            </td>
          </tr>
        `;

        return;
      }

      populateTable(data.services || []);

    } catch (error) {
      console.error(error);

      tbody.innerHTML = `
        <tr>
          <td colspan="11" class="text-center py-4 text-danger">
            Failed to connect to the server.
          </td>
        </tr>
      `;
    }
  }

  // =========================================================
  // POPULATE TABLE
  // =========================================================

  function populateTable(services) {
    const tbody = document.getElementById(
      "PromotionServicesTable"
    );

    tbody.innerHTML = "";

    if (!services || services.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="11" class="text-center py-4">
            No promotion services found.
          </td>
        </tr>
      `;

      return;
    }

    services.forEach((service, index) => {

      const campaign = service.campaign || {};

      const campaignName =
        campaign.title ||
        campaign.name ||
        campaign.slug ||
        "-";

      const campaignSlug = campaign.slug || "";

      const serviceType =
        service.service_type || "-";

      const currency =
        service.currency || "INR";

      const amount =
        Number(service.amount || 0);

      const fee =
        Number(service.fee || 0);

      const tax =
        Number(service.tax || 0);

      const total =
        amount + fee + tax;

      const promotionStatus =
        service.promotion_status ||
        status;

      const createdAt =
        formatDate(service.created_at);

      tbody.innerHTML += `
        <tr>

          <td>
            ${index + 1}
          </td>

          <td>
            <div class="fw-semibold">
              ${campaignName}
            </div>

            ${
              campaignSlug
                ? `<small class="text-muted">
                    ${campaignSlug}
                   </small>`
                : ""
            }
          </td>

          <td>
            <span class="badge bg-light text-dark border service-badge">
              ${getServiceName(serviceType)}
            </span>
          </td>

          <td>
            ${formatAmount(amount, currency)}
          </td>

          <td>
            ${formatAmount(fee, currency)}
          </td>

          <td>
            ${formatAmount(tax, currency)}
          </td>

          <td class="fw-semibold">
            ${formatAmount(total, currency)}
          </td>

          <td>
            ${currency}
          </td>

          <td>
            ${getStatusBadge(promotionStatus)}
          </td>

          <td>
            ${createdAt}
          </td>

          <td>
            <button
              class="btn btn-primary btn-sm"
              onclick="viewPromotion('${service.uuid}')"
            >
              View
            </button>
          </td>

        </tr>
      `;
    });
  }

  // =========================================================
  // VIEW PROMOTION
  // =========================================================

  function viewPromotion(uuid) {
    if (!uuid) {
      return;
    }

    window.location.href =
      `/frontend/admin/promotion-service-verification/${uuid}`;
  }

  // =========================================================
  // FILTER CLICK
  // =========================================================

  document.querySelectorAll(".filter-btn").forEach((button) => {

    button.addEventListener("click", () => {

      const selectedStatus =
        button.dataset.status;

      // Update URL
      const url = new URL(window.location);

      url.searchParams.set(
        "status",
        selectedStatus
      );

      window.history.pushState(
        {},
        "",
        url
      );

      // Update active button
      setActiveFilter(selectedStatus);

      // Load data
      loadPromotionServices(
        selectedStatus
      );
    });

  });

  // =========================================================
  // INITIAL API CALL
  // =========================================================

  loadPromotionServices(status);

</script>


  </body>
</html>
