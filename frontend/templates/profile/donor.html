<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>My Profile</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        background: #f5f7fb;
        min-height: 100vh;
        padding: 40px;
      }

      .profile-container {
        max-width: 700px;
        margin: auto;
        background: white;
        padding: 35px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }
      .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;

        text-decoration: none;
        color: #374151;
        background: #f9fafb;
        border: 1px solid #d1d5db;

        padding: 8px 14px;
        border-radius: 7px;

        font-size: 14px;
        font-weight: 500;

        transition: all 0.2s ease;
      }

      .back-btn:hover {
        background: #f3f4f6;
        border-color: #9ca3af;
        color: #111827;
      }
      h2 {
        text-align: center;
        margin-bottom: 25px;
      }

      #message {
        text-align: center;
        margin-bottom: 15px;
      }

      .success {
        color: green;
      }

      .error {
        color: red;
      }

      /* Tabs */

      .profile-tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 25px;
      }

      .profile-tabs button {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background: #2563eb;
        color: white;
      }

      .section {
        display: none;
      }

      #personal-section {
        display: block;
      }

      label {
        display: block;
        margin-top: 15px;
        font-weight: 600;
      }

      input,
      textarea {
        width: 100%;
        padding: 12px;
        margin-top: 5px;
        border: 1px solid #ddd;
        border-radius: 8px;
      }

      textarea {
        min-height: 100px;
      }

      input[readonly] {
        background: #f3f4f6;
      }

      .profile-image {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
      }

      .profile-image img {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        object-fit: cover;
      }

      button.submit-btn {
        width: 100%;
        margin-top: 25px;
        padding: 14px;
        background: #16a34a;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }

      .card {
        border: 1px solid #ddd;
        padding: 20px;
        border-radius: 10px;
        margin-top: 15px;
      }

      .card button {
        margin-top: 10px;
        padding: 10px 15px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 8px;
      }

      .message-box {
        display: none;
        margin-top: 20px;
        margin-bottom: 12px;
        padding: 12px 15px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
        line-height: 1.5;
      }

      .message-box.success {
        display: block;
        background: #ecfdf5;
        color: #166534;
        border: 1px solid #22c55e;
      }

      .message-box.error {
        display: block;
        background: #fef2f2;
        color: #b91c1c;
        border: 1px solid #ef4444;
      }
    </style>
  </head>

  <body>
    <div class="profile-container">
      <a href="javascript:history.back()" class="back-btn"> ← Back </a>

      <h2>My Profile</h2>

      <!-- Tabs -->

      <div class="profile-tabs">
        <button onclick="showSection('personal')">Personal Information</button>

      </div>

      <!-- =========================
     PERSONAL SECTION
========================= -->

      <div id="personal-section" class="section">
        <form id="donor-profile-form">
          <div class="profile-image">
            <img id="profile-preview" src="" />

            <br /><br />

            <input type="file" id="profile_picture" accept="image/*" />
          </div>

          <label> Full Name </label>

          <input type="text" id="fullname" readonly/>

          <label> Email </label>

          <input type="email" id="email" readonly />

          <label> Mobile </label>

          <input type="text" id="mobile" readonly />

          <label> Occupation </label>

          <input type="text" id="occupation" />

          <label> Address </label>

          <textarea id="address"></textarea>

          <label> City </label>

          <input type="text" id="city" />

          <label> State </label>

          <input type="text" id="state" />

          <label> Country </label>

          <input type="text" id="country" />

          <label> Pincode </label>

          <input type="text" id="pincode" />
          <div id="profile-message" class="message-box"></div>
          <button class="submit-btn">Update Profile</button>
        </form>
      </div>



    </div>

    <script>
      const token = sessionStorage.getItem("access_token");

      const GET_URL = "/api/accounts/donor-profile";

      const UPDATE_URL = "/api/accounts/donor-profile/update";




      const form = document.getElementById("donor-profile-form");

      const profileImage = document.getElementById("profile_picture");

      const preview = document.getElementById("profile-preview");

      let profileStatus = "";





      // =========================
      // Load Profile
      // =========================

      async function loadProfile() {
        try {
          const response = await fetch(GET_URL, {
            headers: {
              Authorization: `Bearer ${token}`,
            },
          });

          const result = await response.json();

          if (!result.success) {
            showMessage(
              "profile-message",
              result.error || "Unable to load profile.",
              "error",
            );
            return;
          }

          const data = result.data;

          fullname.value = data.fullname || "";
          email.value = data.email || "";
          mobile.value = data.mobile || "";
          occupation.value = data.occupation || "";
          address.value = data.address || "";
          city.value = data.city || "";
          state.value = data.state || "";
          country.value = data.country || "";
          pincode.value = data.pincode || "";

          if (data.profile_picture) {
            preview.src = data.profile_picture;
            preview.style.display = "block";
          } else {
            preview.removeAttribute("src");
            preview.style.display = "none";
          }

          profileStatus = data.profile_status;

          toggleEditMode(profileStatus);
        } catch (error) {
          console.error(error);
          showMessage("profile-message", "Unable to load profile.", "error");
        }
      }


      //Disable edit after submission
      function toggleEditMode(status) {
        const editable =
          status === "Profile Completed" || status === "Verification Rejected";

        //Personal Information
        document
          .querySelectorAll(
            "#personal-section input:not([readonly]), #personal-section textarea",
          )
          .forEach((element) => {
            element.disabled = !editable;
          });


        //Documents
        document
          .querySelectorAll("#documents-section input")
          .forEach((element) => {
            element.disabled = !editable;
          });

        //Disable buttons
        document
          .querySelectorAll("#documents-section button")
          .forEach((button) => {
            if (button.innerText.includes("Upload")) {
              button.disabled = !editable;
            }
          });


        document.querySelector("#donor-profile-form button").disabled =
          !editable;

        // Update Profile button
        document.querySelector(
          "#donor-profile-form .submit-btn",
        ).style.display = editable ? "block" : "none";



        // Upload PAN & Aadhaar buttons
        document
          .querySelectorAll("#documents-section button")
          .forEach((button) => {
            if (button.innerText.includes("Upload")) {
              button.style.display = editable ? "inline-block" : "none";
            }
          });
      }
      // Image Preview

      profileImage.onchange = function () {
        if (this.files[0]) {
          preview.src = URL.createObjectURL(this.files[0]);
        }
      };

      // =========================
      // Update Profile
      // =========================

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const formData = new FormData();

        formData.append("occupation", occupation.value.trim());
        formData.append("address", address.value.trim());
        formData.append("city", city.value.trim());
        formData.append("state", state.value.trim());
        formData.append("country", country.value.trim());
        formData.append("pincode", pincode.value.trim());

        if (profileImage.files.length) {
          formData.append("profile_picture", profileImage.files[0]);
        }

        try {
          const response = await fetch(UPDATE_URL, {
            method: "PUT",
            headers: {
              Authorization: `Bearer ${token}`,
            },
            body: formData,
          });

          const result = await response.json();

          if (result.success) {
            showMessage(
              "profile-message",
              result.message || "Profile updated successfully.",
              "success",
            );

            loadProfile();
          } else if (result.errors) {
            const messages = Object.values(result.errors).flat().join("<br>");

            showMessage("profile-message", messages, "error");
          } else {
            showMessage(
              "profile-message",
              result.error || "Failed to update profile.",
              "error",
            );
          }
        } catch (error) {
          console.error(error);

          showMessage(
            "profile-message",
            "Something went wrong. Please try again.",
            "error",
          );
        }
      });

      // =========================
      // Tabs
      // =========================

      function showSection(section) {
        document.querySelectorAll(".section").forEach((div) => {
          div.style.display = "none";
        });

        document.getElementById(section + "-section").style.display = "block";
      }

      function showMessage(elementId, message, type) {
        const box = document.getElementById(elementId);

        box.innerHTML = message;
        box.className = `message-box ${type}`;
        box.style.display = "block";

        setTimeout(() => {
          box.style.display = "none";
          box.innerHTML = "";
        }, 5000);
      }
      function getFileName(url) {
        if (!url) {
          return "";
        }

        return url.split("/").pop();
      }
      loadProfile();
    </script>
  </body>
</html>
