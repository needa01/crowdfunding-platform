<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSR Registration</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
}

.container{
    width:600px;
    margin:50px auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

h2{
    text-align:center;
}

input,
textarea,
button{
    width:100%;
    padding:12px;
    margin-top:12px;
    box-sizing:border-box;
}

button{
    background:#007bff;
    color:white;
    border:none;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

.success{
    color:green;
}

.error{
    color:red;
}

</style>

</head>
<body>

<div class="container">

    <h2>CSR Registration</h2>

    <form id="csrForm">

        <input
            type="text"
            id="csr_name"
            placeholder="CSR Name"
            required
        >

        <input
            type="text"
            id="csr_reg_num"
            placeholder="Registration Number"
            required
        >

        <input
            type="text"
            id="contact_person_name"
            placeholder="Contact Person Name"
            required
        >

        <input
            type="text"
            id="contact_person_designation"
            placeholder="Contact Person Designation"
            required
        >

        <textarea
            id="address"
            placeholder="Address"
            required
        ></textarea>

        <input
            type="text"
            id="city"
            placeholder="City"
            required
        >

        <input
            type="text"
            id="state"
            placeholder="State"
            required
        >

        <input
            type="text"
            id="country"
            placeholder="Country"
            required
        >

        <input
            type="text"
            id="pincode"
            placeholder="Pincode"
            required
        >

        <input
            type="url"
            id="website"
            placeholder="Website"
        >

        <button type="submit">
            Register CSR
        </button>

    </form>

    <br>

    <div id="message"></div>

</div>

<script>

function checkAuthentication(){

    const accessToken =
        sessionStorage.getItem("access_token");

    if(!accessToken){

        alert("Please login first");

        window.location.href =
            "/frontend/login";

        return false;
    }

    return true;
}

window.onload = function(){
    checkAuthentication();
};

document
.getElementById("csrForm")
.addEventListener("submit", async function(event){

    event.preventDefault();

    const accessToken =
        sessionStorage.getItem("access_token");

    if(!accessToken){

        window.location.href =
            "/frontend/login";

        return;
    }

    const payload = {

        csr_name:
            document.getElementById("csr_name").value,

        csr_reg_num:
            document.getElementById("csr_reg_num").value,

        contact_person_name:
            document.getElementById("contact_person_name").value,

        contact_person_designation:
            document.getElementById("contact_person_designation").value,

        address:
            document.getElementById("address").value,

        city:
            document.getElementById("city").value,

        state:
            document.getElementById("state").value,

        country:
            document.getElementById("country").value,

        pincode:
            document.getElementById("pincode").value,

        website:
            document.getElementById("website").value
    };

    try{

        const response = await fetch(
            "/api/accounts/register/csr",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json",
                    "Authorization":
                        `Bearer ${accessToken}`
                },
                body:JSON.stringify(payload)
            }
        );

        if(response.status === 401){

            sessionStorage.removeItem("access_token");
            sessionStorage.removeItem("refresh_token");

            alert("Session expired");

            window.location.href =
                "/frontend/login";

            return;
        }

        const data = await response.json();
        console.log("data",data)
        if(data.success){

            document.getElementById("message").innerHTML =
                `<p class="success">${data.message}</p>`;

            setTimeout(() => {

                window.location.href =
                    "/frontend/campaigns";

            }, 1000);

        }else{
            console.log("data error",data.error);
            document.getElementById("message").innerHTML =
                `<p class="error">${data.error}</p>`;
        }

    }catch(error){
        console.log("error",error);
        document.getElementById("message").innerHTML =
            `<p class="error">Something went wrong</p>`;
    }

});

</script>

</body>
</html>
