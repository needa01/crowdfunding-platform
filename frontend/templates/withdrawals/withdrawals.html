<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Under Construction</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: #f5f7fb;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1f2937;
        }

        .container {
            text-align: center;
            padding: 40px 20px;
            max-width: 600px;
        }

        .icon {
            font-size: 80px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
            font-weight: 700;
        }

        p {
            font-size: 18px;
            color: #6b7280;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .badge {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 30px;
            background: #fff3cd;
            color: #856404;
            font-size: 14px;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 32px;
            }

            p {
                font-size: 16px;
            }

            .icon {
                font-size: 65px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">🚧</div>

        <h1>Page Under Construction</h1>

        <p>
            We're working on something great.
            This page is currently under construction and will be available soon.
        </p>

        <span class="badge">Coming Soon</span>

    </div>

</body>

</html>
